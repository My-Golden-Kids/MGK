spring:
  config:
    import: classpath:security.yml
  application:
    name: BE_MGK
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

google:
  vision:
    credentials-path: secrets/vision-key.json

cloud:
  aws:
    s3:
      endpoint: ${AWS_S3_ENDPOINT:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://mygoldenkids.topician.com,http://localhost:3000,http://localhost:3001,http://172.16.20.165:3000}
