spring:
  datasource:
    url: jdbc:h2:mem:be_mgk;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  ai:
    google:
      genai:
        api-key: test-gemini-api-key
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.5
