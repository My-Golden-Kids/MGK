name: MGK CI/CD

on:
  push:
    branches: ["dev"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Inject BE secrets
        working-directory: BE
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.SECURITY_YML }}" > src/main/resources/security.yml

      - name: Build BE jar
        working-directory: BE
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Build FE
        working-directory: FE
        run: |
          echo "${{ secrets.DOT_ENV }}" > .env
          pnpm install --frozen-lockfile
          pnpm exec next build --webpack

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.WAS_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy files to EC2
        run: |
          scp BE/build/libs/*.jar ec2-user@${{ secrets.WAS_HOST }}:/home/ec2-user/workspace/MGK/BE/app.jar
          scp FE/.env ec2-user@${{ secrets.WAS_HOST }}:/home/ec2-user/workspace/MGK/FE/.env

          ssh ec2-user@${{ secrets.WAS_HOST }} "mkdir -p /home/ec2-user/workspace/MGK/BE/secrets"

          ssh ec2-user@${{ secrets.WAS_HOST }} "printf '%s' '${{ secrets.OCR_KEY_JSON }}' > /home/ec2-user/workspace/MGK/BE/secrets/vision-key.json"

      - name: Restart services on EC2
        run: |
          ssh ec2-user@${{ secrets.WAS_HOST }} "
            cd /home/ec2-user/workspace/MGK/BE &&
            pkill -f 'java -jar app.jar' || true &&
            nohup java -jar app.jar > /home/ec2-user/mgk-be.log 2>&1 &
          "

          ssh ec2-user@${{ secrets.WAS_HOST }} "
            cd /home/ec2-user/workspace/MGK/FE &&
            pkill -f 'next start -p 3000' || true &&
            nohup pnpm exec next start -p 3000 > /home/ec2-user/mgk-fe.log 2>&1 &
          "