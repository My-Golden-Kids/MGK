name: MGK CI/CD

on:
  push:
    branches: ["orgin/release"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: BE secrets
        working-directory: BE
        run: |
          mkdir -p src/main/resources
          printf '%s' "${{ secrets.SECURITY_YML }}" > src/main/resources/security.yml

      - name: Build BE jar
        working-directory: BE
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Build FE
        working-directory: FE
        run: |
          echo "${{ secrets.DOT_ENV }}" > .env
          pnpm install --frozen-lockfile
          pnpm exec next build --webpack

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.WAS_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy files to EC2
        run: |
          scp BE/build/libs/*.jar ec2-user@${{ secrets.WAS_HOST }}:/home/ec2-user/workspace/MGK/BE/app.jar
          scp FE/.env ec2-user@${{ secrets.WAS_HOST }}:/home/ec2-user/workspace/MGK/FE/.env
          ssh ec2-user@${{ secrets.WAS_HOST }} "rm -rf /home/ec2-user/workspace/MGK/FE/.next"
          scp -r FE/.next ec2-user@${{ secrets.WAS_HOST }}:/home/ec2-user/workspace/MGK/FE/.next

          ssh ec2-user@${{ secrets.WAS_HOST }} "mkdir -p /home/ec2-user/workspace/MGK/BE/secrets"
          printf '%s' "${{ secrets.OCR_KEY_JSON_B64 }}" | base64 -d > /tmp/vision-key.json
          python3 -m json.tool /tmp/vision-key.json > /dev/null
          scp /tmp/vision-key.json ec2-user@${{ secrets.WAS_HOST }}:/home/ec2-user/workspace/MGK/BE/secrets/vision-key.json
          ssh ec2-user@${{ secrets.WAS_HOST }} "chmod 600 /home/ec2-user/workspace/MGK/BE/secrets/vision-key.json"

      - name: Verify OCR key JSON on EC2
        run: |
          ssh ec2-user@${{ secrets.WAS_HOST }} "python3 -m json.tool /home/ec2-user/workspace/MGK/BE/secrets/vision-key.json > /dev/null"

      - name: Git pull & Restart FE,BE Server
        run: |
          ssh ec2-user@${{ secrets.WAS_HOST }} "
            export APP_CORS_ALLOWED_ORIGINS='${{ secrets.APP_CORS_ALLOWED_ORIGINS }}' &&
            cd /home/ec2-user/workspace/MGK &&
            git restore BE/src/main/resources/application.yml || true &&
            git pull origin dev &&
            cd /home/ec2-user/workspace/MGK/BE &&
            if pm2 describe mgk-be > /dev/null 2>&1; then
              pm2 restart mgk-be --update-env;
            else
              pm2 start 'java -jar app.jar' --name mgk-be;
            fi
          "

          ssh ec2-user@${{ secrets.WAS_HOST }} "
            cd /home/ec2-user/workspace/MGK/FE &&
            pnpm install --frozen-lockfile &&
            if pm2 describe mgk-fe > /dev/null 2>&1; then
              pm2 restart mgk-fe --update-env;
            else
              pm2 start 'pnpm exec next start -p 3000' --name mgk-fe;
            fi
          "

          ssh ec2-user@${{ secrets.WAS_HOST }} "
            pm2 save
          "
